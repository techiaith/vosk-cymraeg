services:
  training_env:
    image: kaldi-training-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Use GPU 1 only (use ["0", "1"] for both)
              capabilities: [gpu]
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        USERNAME: ${USER}
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - .:/workspaces/vosk
    environment:
      - HF_TOKEN=${HF_TOKEN}
    stdin_open: true
    tty: true
volumes:
  .:
